(()=>{const root=document.body,hero=document.querySelector("#dock7-hero"),items=[...document.querySelectorAll(".dock7-hero,.dock7-scene")];if(!("IntersectionObserver"in window)){items.forEach(el=>el.classList.add("is-visible"));return}const reveal=new IntersectionObserver(entries=>entries.forEach(entry=>entry.target.classList.toggle("is-visible",entry.isIntersecting)),{threshold:.08,rootMargin:"0px 0px -8% 0px"});items.forEach((el,i)=>{if(el.classList.contains("dock7-scene"))el.style.transitionDelay=(i%3)*70+"ms";reveal.observe(el)});const headerFade=new IntersectionObserver(entries=>{root.classList.toggle("dock7-header-away",entries[0].isIntersecting)},{threshold:.16});if(hero)headerFade.observe(hero)})();
